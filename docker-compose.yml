# ============================================================
# 荷源管理系统 —— 基础设施一键拉起（方案 A）
#
# 用法：项目根目录执行
#   docker compose up -d          # 启动全部
#   docker compose down           # 停止（数据保留在 docker/*/data）
#   docker compose down -v        # 停止并清空数据
#
# 包含：MySQL 8.0（业务库）+ Redis 7（缓存/会话）
#
# 注意：Milvus 已改用 Zilliz Cloud 托管（免费 Serverless），
#       无需在本机跑 etcd/minio/milvus，节省约 4GB 内存。
#       只需在 .env.prod 里配置：
#         MILVUS_ADDRESS = https://xxx.api.xxx.zillizcloud.com
#         MILVUS_TOKEN   = 你的 Zilliz API Key
#
# 端口/账号已对齐 .env（无需改动）：
#   MySQL : localhost:3306  root/root  db=heyuan
#   Redis : localhost:6379  无密码     db=0
# ============================================================

networks:
  heyuan:
    driver: bridge

services:
  # ============ MySQL 8.0（业务数据库） ============
  mysql:
    image: mysql:8.0
    container_name: heyuan-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root          # 对应 .env.prod MYSQL_PASSWORD
      MYSQL_DATABASE: heyuan             # 对应 .env.prod MYSQL_DB，首次启动自动建库
      MYSQL_ROOT_HOST: "%"               # 允许宿主机 root 远程连接
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      # 首次启动自动初始化表结构和初始数据
      - ./sql/mysql/heyuan.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - heyuan
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis 7（缓存 / 会话） ============
  redis:
    image: redis:7.2
    container_name: heyuan-redis
    restart: unless-stopped
    # 对应 .env.prod：无密码（REDIS_PASSWORD 为空）
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    networks:
      - heyuan
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
